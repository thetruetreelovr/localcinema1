<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101311">
  <meta name="description" content="Локальный кинотеатр — ваша личная видеотека без онлайн-стримингов.">
  <title>Jangle — Local Cinema</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/android-adapter.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <div class="boot-screen">
      <div class="brand-mark">J</div>
      <p>Подготовка локального кинотеатра…</p>
    </div>
  </div>
  <input id="directory-fallback" type="file" webkitdirectory directory multiple hidden>
  <input id="image-picker" type="file" accept="image/*" hidden>
</body>
</html>
