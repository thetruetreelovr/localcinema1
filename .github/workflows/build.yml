name: Build Jangle Local Cinema APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.2
        with:
          # The old SDK package "tools" is no longer published by Google.
          # setup-android v4.0.2 defaults to platform-tools; keep it explicit.
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the current web app into Android WebView assets
        shell: bash
        run: |
          set -euo pipefail
          WEB="Jangle_Local_Cinema_3.0.1"
          ANDROID_MAIN="$WEB/android/app/src/main"
          ASSETS="$ANDROID_MAIN/assets/www"

          test -f "$WEB/index.html"
          test -f "$WEB/js/app.js"
          test -f "$WEB/js/android-adapter.js"
          test -f "$WEB/css/app.css"
          grep -q 'js/android-adapter.js' "$WEB/index.html"
          grep -q 'JangleAndroidBridge' "$WEB/js/android-adapter.js"
          grep -q 'JangleAndroidBridge' "$ANDROID_MAIN/java/com/directbone/jangle/MainActivity.kt"

          rm -rf "$ASSETS"
          mkdir -p "$ASSETS"
          cp "$WEB/index.html" "$WEB/manifest.webmanifest" "$WEB/sw.js" "$ASSETS/"
          cp -R "$WEB/css" "$WEB/js" "$WEB/icons" "$ASSETS/"

          test -f "$ASSETS/js/android-adapter.js"
          echo "WebView assets prepared with Android SAF adapter."

      - name: Build Debug APK
        working-directory: Jangle_Local_Cinema_3.0.1/android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jangle_Local_Cinema_3.0.1_APK
          path: Jangle_Local_Cinema_3.0.1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
